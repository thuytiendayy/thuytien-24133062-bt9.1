<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layouts/layout :: head('Đăng ký')}"></head>
<body class="auth-page">
    <div class="auth-card">
        <h1>IOTSTAR SHOP</h1>
        <h2>Đăng ký tài khoản</h2>
        
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        
        <form th:action="@{/register}" th:object="${user}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Họ và tên</label>
            <input type="text" th:field="*{fullName}" required autofocus placeholder="Nguyễn Văn A">
            <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>

            <label>Email</label>
            <input type="email" th:field="*{email}" required placeholder="user@gmail.com">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <label>Mật khẩu</label>
            <input type="password" th:field="*{password}" required placeholder="Tối thiểu 6 ký tự">
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

            <button class="btn primary full mt" type="submit">Đăng ký</button>
        </form>
        
        <p class="actions mt">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
        </p>
    </div>
</body>
</html>
