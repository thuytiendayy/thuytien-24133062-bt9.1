<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layouts/layout :: head('Xác nhận OTP')}"></head>
<body class="auth-page">
    <div class="auth-card">
        <h1>IOTSTAR SHOP</h1>
        <h2>Xác nhận OTP</h2>
        
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        
        <form th:action="@{/verify-otp}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Nhập mã OTP (6 số gửi về email)</label>
            <input type="text" name="otp" required maxlength="6" autofocus placeholder="123456">

            <button class="btn primary full mt" type="submit">Xác nhận</button>
        </form>
        
        <p class="actions mt">
            <a th:href="@{/login}">Hủy bỏ</a>
        </p>
    </div>
</body>
</html>
