<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body class="auth-page">
    <div class="auth-card">
        <h1>IOTSTAR SHOP</h1>
        <h2>Đặt lại mật khẩu</h2>
        
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        
        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Nhập mật khẩu mới</label>
            <input type="password" name="password" required minlength="6" autofocus placeholder="Mật khẩu mới">

            <button class="btn primary full mt" type="submit">Cập nhật mật khẩu</button>
        </form>
    </div>
</body>
</html>
