<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layouts/layout :: head('Quên mật khẩu')}"></head>
<body class="auth-page">
    <div class="auth-card">
        <h1>IOTSTAR SHOP</h1>
        <h2>Quên mật khẩu</h2>
        
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        
        <form th:action="@{/forgot-password}" th:object="${forgotDTO}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>Nhập email tài khoản của bạn</label>
            <input type="email" th:field="*{email}" required placeholder="user@gmail.com">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <button class="btn primary full mt" type="submit">Gửi mã OTP</button>
        </form>
        
        <p class="actions mt">
            <a th:href="@{/login}">Quay lại Đăng nhập</a>
        </p>
    </div>
</body>
</html>
